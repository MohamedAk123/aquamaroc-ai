name: AquaMaroc — Livraison d’images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier les images et enregistrer leurs digests
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push --tag "$prefix-api:$GITHUB_SHA" \
            --metadata-file api-image.json -f services/api/Dockerfile .
          docker buildx build --push --tag "$prefix-web:$GITHUB_SHA" \
            --metadata-file web-image.json --build-arg NEXT_PUBLIC_API_URL= apps/web
          printf 'API_IMAGE=%s-api@%s\n' "$prefix" "$(jq -r '."containerimage.digest"' api-image.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'WEB_IMAGE=%s-web@%s\n' "$prefix" "$(jq -r '."containerimage.digest"' web-image.json)" | tee -a "$GITHUB_STEP_SUMMARY"
