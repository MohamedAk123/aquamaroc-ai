name: AquaMaroc — Validation continue
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_URL=http://127.0.0.1:8000
      - run: flutter build apk --debug --dart-define=API_URL=http://127.0.0.1:8000
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: aquamaroc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d aquamaroc_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test-only-ci@localhost:5432/aquamaroc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Aucun fichier .env versionné
        run: python scripts/check_tracked_secrets.py
      - run: docker compose --env-file .env.example config --quiet
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
        working-directory: .
      - run: python -m scripts.prepare_e2e
        working-directory: .
        env:
          DATABASE_URL: sqlite:///./e2e.db
          APP_MODE: demo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test -- --workers=2
        env:
          DATABASE_URL: sqlite:///./e2e.db
          APP_MODE: demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Démarrer une composition officielle isolée
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait
      - name: Tester le périmètre public et la restauration
        run: |
          curl --fail http://127.0.0.1:8080/health | jq -e '.mode == "official"'
          curl --fail http://127.0.0.1:8080/api/v1/overview | jq -e '.reservoir_count == 0'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = 404
          test "$(curl -sS -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/overview)" = 403
          python -m scripts.backup_db backup backups/ci
          python -m scripts.backup_db rehearse backups/ci
      - if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down --volumes
