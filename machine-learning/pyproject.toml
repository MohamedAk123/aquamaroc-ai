[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "aquamaroc-ml"
version = "0.1.0"
requires-python = ">=3.12"
description = "Audit, analyse rétrospective et benchmarks hors ligne AquaMaroc"
dependencies = []

[project.optional-dependencies]
ml = ["numpy", "pandas", "scikit-learn", "catboost", "xgboost", "lightgbm", "shap", "mlflow"]
automl-h2o = ["h2o==3.46.0.12", "pandas"]
automl-flaml = ["flaml[automl]==2.8.0", "pandas", "catboost", "xgboost", "lightgbm"]
hydrology-demo = ["h2o==3.46.0.12", "pandas", "mlflow==3.18.0", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]
