worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $server_name zone=api_budget:1m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 8080 default_server;
        server_name aquamaroc;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Resolve Docker service names again after rolling replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        set $web http://web:3000;

        location = /health {
            limit_except GET { deny all; }
            proxy_pass $api;
        }
        location ^~ /api/v1/ {
            limit_except GET { deny all; }
            limit_req zone=api_budget burst=60 nodelay;
            proxy_pass $api;
        }
        location ~ ^/(metrics|ready|docs|redoc|openapi[.]json)(/|$) {
            return 404;
        }
        location / {
            limit_except GET { deny all; }
            proxy_pass $web;
        }
    }
}
